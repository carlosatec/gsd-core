name: Tests

on:
  push:
    branches:
      - next
      - main
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - next
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect test scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code_changed: ${{ steps.scope.outputs.code_changed }}
      full_matrix: ${{ steps.scope.outputs.full_matrix }}
      product_changed: ${{ steps.scope.outputs.product_changed }}
      targeted_tests: ${{ steps.scope.outputs.targeted_tests }}
      windows_tests: ${{ steps.scope.outputs.windows_tests }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            {
              echo "code_changed=true"
              echo "product_changed=true"
              echo "full_matrix=true"
              echo "targeted_tests="
              echo "windows_tests="
            } >> "$GITHUB_OUTPUT"
            {
              echo "## Test scope"
              echo ""
              echo "- event: \`$EVENT_NAME\`"
              echo "- code_changed: \`true\`"
              echo "- full_matrix: \`true\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node scripts/ci-test-scope.cjs --base "$BASE_SHA" --head "$HEAD_SHA" | tee ci-test-scope.json
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('ci-test-scope.json', 'utf8'));
          console.log('## Test scope');
          console.log('');
          console.log(`- code_changed: \`${result.code_changed}\``);
          console.log(`- full_matrix: \`${result.full_matrix}\``);
          console.log(`- targeted_tests: \`${result.targeted_tests.length}\``);
          console.log(`- windows_tests: \`${result.windows_tests.length}\``);
          if (result.reasons.length > 0) {
            console.log('');
            console.log('### Reasons');
            for (const reason of result.reasons) console.log(`- ${reason}`);
          }
          NODE

  lint-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: true
          token: ${{ github.token }}
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24
      - name: Install dev dependencies
        run: npm ci --ignore-scripts
      - name: Build runtime lib (required by lint scripts)
        run: npm run build:lib
      - name: Build hooks distribution (verify hook syntax & dist copy)
        run: npm run build:hooks
      - name: Lint — all (ESLint, skill deps, test-file count, command contract, PR checks, legacy name, regression-test names, resolution-provenance)
        run: npm run lint:ci

  # Fast required multi-OS verification lane (full legacy unit + c8 matrix lives
  # in .github/workflows/test-full.yml on workflow_dispatch + nightly schedule).
  test:
    name: test (${{ matrix.os }}, ${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      GSD_PLUGIN_ROOT: .ci-gsd-plugin-root-disabled
      GSD_STRICT_LIVE_CONFIG_GUARD: ${{ matrix.os != 'windows-latest' && '1' || '' }}
      GSD_EMITTED_BASE: ${{ github.event.pull_request.base.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 24
            shell: bash
          - os: windows-latest
            node-version: 24
            shell: pwsh
          - os: macos-latest
            node-version: 24
            shell: 'zsh {0}'

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (Windows)
        if: runner.os == 'Windows'
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (Linux/macOS)
        if: runner.os != 'Windows'
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Guard — require GitHub-hosted runner
        run: node scripts/ci-guard-runner.cjs

      - name: Rebase check — merge PR base branch into PR head
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_REBASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-rebase-check.cjs

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Environment check
        run: npm run check:env

      - name: Install dependencies
        run: npm ci

      - name: Dependency integrity gate
        run: node scripts/check-npm-integrity.cjs

      - name: Build runtime lib
        run: npm run build:lib

      - name: Build hooks distribution
        run: npm run build:hooks

      - name: Run GSD Core Nexus Test Suite
        run: node scripts/run-nexus-tests.cjs

      - name: Run security tests
        run: npm run test:security

      - name: Run Phase 38 hardening and CI policy tests
        run: node scripts/run-tests.cjs --files "tests/phase37-06-review-fixes.test.cjs tests/phase38-untested-modules.test.cjs tests/ci-full-lane-sharding.test.cjs tests/ci-test-job-timeout-budget.test.cjs tests/ci-test-scope.test.cjs tests/workflow-shell-pinning.test.cjs tests/policy-shell-pinning.test.cjs tests/live-config-guard.test.cjs tests/gsd-mcp-server.test.cjs tests/gsd-mcp-server-bin.test.cjs tests/worktree-isolation.test.cjs tests/transactional-file-lock.test.cjs tests/gsd-agent-isolation-guard.test.cjs tests/runtime-name-policy.test.cjs tests/runtime-artifact-layout-descriptor-drive.test.cjs tests/capability-state.test.cjs tests/package-name-single-source.test.cjs"

      - name: Run ESM dual-package test
        run: node --test tests/esm-dual-package.test.mjs

  test-inert:
    name: test (inert CI)
    needs: changes
    if: needs.changes.outputs.code_changed == 'true' && needs.changes.outputs.product_changed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GSD_PLUGIN_ROOT: .ci-gsd-plugin-root-disabled
      GSD_STRICT_LIVE_CONFIG_GUARD: '1'
      GSD_EMITTED_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}
      - name: Guard — require GitHub-hosted runner
        run: node scripts/ci-guard-runner.cjs
      - name: Rebase check — merge PR base branch into PR head
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_REBASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-rebase-check.cjs
      - name: Set up Node.js 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24
          cache: 'npm'
      - name: Environment check
        run: npm run check:env
      - name: Install dependencies
        run: npm ci
      - name: Dependency integrity gate
        run: node scripts/check-npm-integrity.cjs
      - name: Prepare scoped test list
        env:
          TEST_SCOPE: targeted
          TARGETED_TESTS: ${{ needs.changes.outputs.targeted_tests }}
          WINDOWS_TESTS: ${{ needs.changes.outputs.windows_tests }}
        run: node scripts/ci-prepare-test-scope.cjs
      - name: Run scoped tests
        run: node scripts/run-tests.cjs --files-from .ci-selected-tests.txt

  qa-loop-walk:
    name: QA loop walk (smell ratchet)
    needs: changes
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GSD_PLUGIN_ROOT: .ci-gsd-plugin-root-disabled
      GSD_STRICT_LIVE_CONFIG_GUARD: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Guard — require GitHub-hosted runner
        run: node scripts/ci-guard-runner.cjs

      - name: Set up Node.js 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Environment check
        run: npm run check:env

      - name: Install dependencies
        run: npm ci

      - name: Dependency integrity gate
        run: node scripts/check-npm-integrity.cjs

      - name: Build runtime lib (required by the QA walk's gsd-tools invocations)
        run: npm run build:lib

      - name: Run QA loop-walk scenarios
        run: npm run test:qa

      - name: QA smell ratchet
        run: npm run lint:qa-smells -- --json qa-report.json

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: qa-report
          path: qa-report.json
          if-no-files-found: ignore
          retention-days: 3

  required-tests:
    name: Required tests
    needs:
      - changes
      - lint-tests
      - test
      - test-inert
      - qa-loop-walk
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Summarize required test gate
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code_changed }}
          PRODUCT_CHANGED: ${{ needs.changes.outputs.product_changed }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint-tests.result }}
          TEST_RESULT: ${{ needs.test.result }}
          INERT_RESULT: ${{ needs.test-inert.result }}
          QA_LOOP_WALK_RESULT: ${{ needs.qa-loop-walk.result }}
        run: |
          set -euo pipefail
          echo "code_changed=$CODE_CHANGED"
          echo "product_changed=$PRODUCT_CHANGED"
          echo "changes=$CHANGES_RESULT"
          echo "lint-tests=$LINT_RESULT"
          echo "test=$TEST_RESULT"
          echo "test-inert=$INERT_RESULT"
          echo "qa-loop-walk=$QA_LOOP_WALK_RESULT"

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::test scope detection did not pass"
            exit 1
          fi

          if [ "$LINT_RESULT" != "success" ]; then
            echo "::error::lint-tests did not pass"
            exit 1
          fi

          if [ "$CODE_CHANGED" != "true" ]; then
            echo "No code paths changed; matrix tests intentionally skipped."
            exit 0
          fi

          if [ "$PRODUCT_CHANGED" = "true" ]; then
            if [ "$TEST_RESULT" != "success" ]; then
              echo "::error::test matrix did not pass"
              exit 1
            fi

            if [ "$QA_LOOP_WALK_RESULT" != "success" ] && [ "$QA_LOOP_WALK_RESULT" != "skipped" ]; then
              echo "::error::qa-loop-walk did not pass"
              exit 1
            fi
          else
            if [ "$INERT_RESULT" != "success" ]; then
              echo "::error::inert CI lane did not pass"
              exit 1
            fi
          fi

          echo "Required test gate passed."

  guard-no-ack-on-next:
    name: Guard no spent ack on next
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Assert tests/emitted-drift-ack.json is absent
        run: node scripts/lint-emitted-drift-ack.cjs --guard-next
